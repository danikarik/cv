name: Deploy

# Deploys to Cloudflare Pages on every push to main.
#
# One-time setup:
#   1. Create the Pages project once (locally, after `wrangler login`):
#        pnpm exec wrangler pages project create cv --production-branch=main
#   2. Add two GitHub repo secrets (Settings → Secrets and variables → Actions):
#        CLOUDFLARE_API_TOKEN   – token with the "Cloudflare Pages: Edit" permission
#        CLOUDFLARE_ACCOUNT_ID  – your Cloudflare account id
# Project name + output dir (dist) come from wrangler.jsonc.
# Node.js and pnpm versions come from devEngines in package.json.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs Vite+ (version from the pnpm catalog), then runs `vp install`.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          cache: true

      - name: Format, lint, type-check & test
        run: |
          vp check
          vp test --run --passWithNoTests

      - name: Build
        run: vp run build

      - name: Deploy to Cloudflare Pages
        run: vp exec wrangler pages deploy --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
